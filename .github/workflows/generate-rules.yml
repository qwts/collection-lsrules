name: Generate Little Snitch Rules

on:
  push:
    branches: [ main ]
    paths:
      - 'config/paths.json'
      - 'config/domains.json'
      - 'blocked.lsrules'
      - '.github/workflows/generate-rules.yml'
      - 'scripts/generate-rules.js'
  pull_request:
    branches: [ main ]
    paths:
      - 'config/paths.json'
      - 'config/domains.json'
      - 'blocked.lsrules'
      - '.github/workflows/generate-rules.yml'
      - 'scripts/generate-rules.js'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write # Required for the commit-and-push step below

env:
  # Every output rendered from config/domains.json. Keep in sync with the
  # cases list in checkRules() in scripts/generate-rules.js.
  GENERATED_FILES: generated/coding.lsrules generated/browsers.lsrules terminal.lsrules

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check committed outputs are fresh
      # Pull requests must ship regenerated outputs: fail closed on drift or
      # on registry entries that contradict blocked.lsrules.
      if: github.event_name == 'pull_request'
      run: npm test

    - name: Generate coding, browsers and terminal rules
      run: |
        node scripts/generate-rules.js
        
    - name: Check if generated outputs changed
      id: check-changes
      run: |
        if git diff --exit-code --name-only -- $GENERATED_FILES; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes to generated outputs"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Generated outputs were updated"
        fi
        
    - name: Commit and push if changed
      # Only push on direct pushes to a branch. `pull_request` checkouts are
      # a detached-HEAD merge ref with no branch to push to, and forked PRs
      # can't write through the default token anyway.
      if: github.event_name == 'push' && steps.check-changes.outputs.changes == 'true'
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add -- $GENERATED_FILES
        git commit -m "chore: regenerate Little Snitch rules [skip ci]"
        git push
        
    - name: Upload generated rules as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lsrules
        path: |
          generated/coding.lsrules
          generated/browsers.lsrules
          terminal.lsrules
        retention-days: 7
